[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-jovi"
dynamic = ["version"]
description = "Shortcuts-style automation for the Linux desktop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6", "requests>=2.33", "Flask>=3.1.3", "Werkzeug>=3.1.9", "pywebview>=5", "watchdog>=4",
]

[project.scripts]
cronjovi = "cron_jovi.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cron_jovi.__version__" }

[tool.setuptools.packages.find]
include = ["cron_jovi*"]

[tool.setuptools.package-data]
"cron_jovi" = ["error_table.yaml"]
"cron_jovi.gui" = ["static/*", "templates/*.yaml"]
